# conda env for InfiniDream + Infinigen (tested: Linux x86_64, CUDA 12/13, RTX 4090, Blender/bpy 4.2)
name: infinidream
channels:
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - gxx=11.4.0
  - mesalib
  - glew
  - glm
  - zlib
  - glfw
  - ffmpeg
  - pip
  - pip:
      - -r requirements.txt
